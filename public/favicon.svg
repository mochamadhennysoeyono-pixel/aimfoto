<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f4f5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-opacity="0.75" />

  <!-- Subtle camera shutter aperture ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#27272a" stroke-width="4" stroke-dasharray="16 12" />

  <!-- Photobooth Flash Sparkle Accent -->
  <path d="M256 86 L266 118 L298 128 L266 138 L256 170 L246 138 L214 128 L246 118 Z" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Initials "AIM" -->
  <g filter="url(#glow)">
    <text x="256" y="326" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="164" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="url(#textGrad)">
      AIM
    </text>
  </g>

  <!-- Amber Accent Dot -->
  <circle cx="256" cy="382" r="14" fill="url(#accentGrad)" />
</svg>
